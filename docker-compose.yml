services:
    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        environment:
            HOST: ${HOST}
            PORT: ${PORT}
            DATABASE_URL: ${DATABASE_URL}
        ports:
            - "127.0.0.1:${PORT}:${PORT}"
        depends_on:
            database-init:
                condition: service_completed_successfully
            keycloak:
                condition: service_healthy
            redis:
                condition: service_healthy

    database-init:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        working_dir: /app/apps/api
        environment:
            DATABASE_URL: ${DATABASE_SETUP_URL}
        depends_on:
            postgres:
                condition: service_healthy
        command: ["sh", "-c", "npx prisma migrate deploy --config prisma7.config.ts && npm run db:seed"]

    postgres:
        image: postgres:18.6
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    keycloak-postgres:
        image: postgres:18.6
        environment:
            POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
            POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER}
            POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
        volumes:
            - keycloak-postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    keycloak:
        image: quay.io/keycloak/keycloak:26.8.1
        command: ["start-dev", "--import-realm"]
        depends_on:
            keycloak-postgres:
                condition: service_healthy
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_POSTGRES_DB}
            KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER}
            KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
            KC_HOSTNAME: ${KC_HOSTNAME}
            KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
            KC_HEALTH_ENABLED: "true"
            KC_METRICS_ENABLED: "true"
        volumes:
            - ./infra/keycloak/development:/opt/keycloak/data/import:ro
        ports:
            - "127.0.0.1:8080:8080"
        healthcheck:
            test:
                - CMD
                - bash
                - -ec
                - >-
                    { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 60s

    redis:
        image: redis:8.10.3
        command:
            - redis-server
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
        mem_limit: 256m
        healthcheck:
            test: ["CMD", "redis-cli", "-e", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres-data:
    keycloak-postgres-data:
